# ============================================================
# CreditAgent 全局配置
# ============================================================

# ---------- LLM(微调后的 Qwen3-4B / 或任意 OpenAI 兼容服务)----------
llm:
  # 接入方式: "openai_api"(走 vLLM/Ollama 等 OpenAI 兼容接口) 或 "transformers"(本地直接加载)
  backend: "openai_api"
  # OpenAI 兼容服务地址(vLLM 默认 8000 端口)
  # 改成你的 vLLM 服务地址。注意:WSL2 镜像网络下,绑 0.0.0.0 的服务可能无法经
  # 127.0.0.1/localhost 访问,需改用 `hostname -I` 得到的 eth0 真实 IP。
  base_url: "http://localhost:8000/v1"
  api_key: "EMPTY"
  # 推理时使用的模型名(vLLM 启动时 --served-model-name 指定)
  model_name: "credit-qwen3-4b"
  temperature: 0.3
  max_tokens: 1024

  # 当 backend = "transformers" 时使用,直接加载 base + LoRA
  base_model_path: "Qwen/Qwen3-4B"
  lora_adapter_path: "./finetune/output/credit_lora"

# ---------- RAG 检索 ----------
rag:
  # 嵌入模型
  embed_model: "BAAI/bge-m3"
  # 重排模型
  rerank_model: "BAAI/bge-reranker-v2-m3"
  # 知识库原始文档目录
  knowledge_dir: "./data/knowledge"
  # 向量索引落盘目录
  index_dir: "./rag/index"
  # 切分参数
  chunk_size: 400
  chunk_overlap: 80
  # 召回参数:先粗排取 top_k,再精排取 rerank_top_n
  top_k: 20
  rerank_top_n: 4
  use_fp16: true

# ---------- Agent 决策阈值 ----------
agent:
  # 风险评分映射(简单规则,实盘可替换为风控模型)
  approve_threshold: 70      # >=70 通过
  review_threshold: 50       # 50~70 转人工复核, <50 拒绝
